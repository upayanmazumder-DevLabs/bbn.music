name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    uses: ./.github/workflows/build-and-push.yml
    with:
      image_tag: pr-${{ github.event.pull_request.number }}

  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.bbn.music

    steps:
      - name: Deploy PR Preview
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # Pull the PR-specific image
            docker pull ghcr.io/bbn-music/bbnmusic-svelte:pr-${{ github.event.pull_request.number }}

            # Stop and remove existing container if it exists
            docker stop bbnmusic-pr-${{ github.event.pull_request.number }} 2>/dev/null || true
            docker rm bbnmusic-pr-${{ github.event.pull_request.number }} 2>/dev/null || true

            # Run new container with Traefik labels for automatic routing
            docker run -d \
              --name bbnmusic-pr-${{ github.event.pull_request.number }} \
              --network main \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.bbnmusic-pr-${{ github.event.pull_request.number }}.rule=Host(\`pr-${{ github.event.pull_request.number }}.bbn.music\`)" \
              ghcr.io/bbn-music/bbnmusic-svelte:pr-${{ github.event.pull_request.number }}
