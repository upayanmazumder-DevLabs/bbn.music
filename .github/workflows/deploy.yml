name: Deploy to Prod

on:
  push:
    branches: [svelte]

jobs:
  build:
    uses: ./.github/workflows/build-and-push.yml
    with:
      image_tag: latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: cd bbn/ && docker compose up -d --pull always frontend-svelte
